<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>thanks</title>

      <link rel="stylesheet" href="./src/css/sanitize.css" />
      <link rel="stylesheet" href="./src/css/styles.css" />

      <link
         rel="apple-touch-icon"
         sizes="180x180"
         href="./src/assets/favicon/apple-touch-icon.png"
      />
      <link
         rel="icon"
         type="image/png"
         sizes="32x32"
         href="./src/assets/favicon/favicon-32x32.png"
      />
      <link
         rel="icon"
         type="image/png"
         sizes="16x16"
         href="./src/assets/favicon/favicon-16x16.png"
      />
      <link rel="manifest" href="/site.webmanifest" />
   </head>
   <body>
      <main>
         <section id="thanks">
            <div class="section-scroll-work-container">
               <img
                  class="scroll-work-image"
                  src="./src/assets/image/scrollWork.png"
                  alt="scrollWork.png"
               />
            </div>
            <p class="section-title">Gracias</p>

            <div class="thanks-section-content-container">
               <img
                  class="thanks-letter-image"
                  src="./src/assets/image/poe_letter.png"
                  alt="letter-icon"
               />

               <p class="thanks-text">
                  Tu carta ha llegado a mi mesa bajo la luz de una vela. Pronto
                  responderé; hasta entonces, que la noche proteja tu espera.
               </p>

               <a class="thanks-btn" href="/">Aceptar</a>
            </div>
         </section>
      </main>
      <div class="overlay overlay-1"></div>
   </body>
</html>
